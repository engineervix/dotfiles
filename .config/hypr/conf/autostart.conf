exec-once = ~/.config/hypr/scripts/monitor-setup.sh
exec-once = waybar
exec-once = swayosd-server
exec-once = hyprpaper
exec-once = hypridle
exec-once = dunst
exec-once = /usr/libexec/polkit-kde-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets,keyring,ssh
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = udiskie &
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# exec-once = wl-paste -p --watch wl-copy # Sync primary selection to clipboard (copy on select)

# Workspace apps
exec-once = google-chrome
exec-once = kitty
# exec-once = thunar
# exec-once = slack
# exec-once = spotify


# Set GTK Dark Mode
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"
exec-once = gsettings set org.gnome.desktop.interface icon-theme "Papirus-Dark"
