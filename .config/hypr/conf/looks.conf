general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    resize_on_border = false
    allow_tearing = false
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

layout {
    # If only one window is present, don't let it fill the whole width
    # NOTE: we only want this to happen when second monitor is connected, so we control this dynamically in .config/hypr/scripts/monitor-setup.sh
    # single_window_aspect_ratio = 1 1
}


group {
    col.border_active = rgba(33ccffee)
    col.border_inactive = rgba(595959aa)

    groupbar {
        enabled = true
        font_size = 12
        text_color = 0xffffffff
        col.active = rgba(33ccffee)
        col.inactive = rgba(595959aa)
    }
}
