# See https://wiki.hypr.land/Configuring/Monitors/

# Laptop screen — active when no external monitor is connected
monitor=eDP-1,1920x1200@60,0x0,1.25

# External monitor — placed right of eDP-1 at startup; script moves it to 0x0 and disables eDP-1
monitor=HDMI-A-1,3840x2160@60,1536x0,1.5

# Fallback for any unrecognised monitor
monitor=,preferred,auto,1

# External monitor handling (enable/disable eDP-1) is done dynamically by
# scripts/monitor-setup.sh, which listens for Hyprland monitor events.
# Workspace-to-monitor assignment is handled by the script at runtime via
# `hyprctl dispatch moveworkspacetomonitor` — not hardcoded here — so that
# workspace 1 is never stranded on a monitor that no longer exists.
