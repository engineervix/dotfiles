general {
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.7
    vibrancy = 0.1696
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(205, 214, 244, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(166, 173, 200, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, 130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 55
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(203, 166, 247, 1.0)
    inner_color = rgba(30, 30, 46, 0.9)
    font_color = rgba(205, 214, 244, 1.0)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 10
    check_color = rgba(249, 226, 175, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    shadow_passes = 5
    shadow_size = 15
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, -60
    halign = center
    valign = center
}
