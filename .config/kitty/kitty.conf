# ── Selection ─────────────────────────────────────────────
copy_on_select yes

# ── Appearance ────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
geninclude font_size.py

# ── Background ────────────────────────────────────────────
background_opacity 0.85

# ── Cursor ────────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 0

# ── Window ────────────────────────────────────────────────
window_padding_width 10
hide_window_decorations no

# ── Shell Integration ─────────────────────────────────────
# Disabled 'prompt-mark' to prevent escape sequences (133u) from leaking into the input
shell_integration enabled no-prompt-mark

# Remote control -- required for claudecode.nvim kitty vsplit integration
# listen_on creates a socket; KITTY_LISTEN_ON is inherited by child processes (including Neovim)
# so that `kitty @ launch` invoked via vim.fn.jobstart() can reach this instance
allow_remote_control yes
listen_on unix:/tmp/kitty

# ── Layouts ───────────────────────────────────────────
enabled_layouts splits, stack, tall, fat, grid

# ── Keybindings ───────────────────────────────────────
map ctrl+shift+t new_tab_with_cwd

# Splits
map ctrl+shift+minus launch --cwd=current --location=hsplit
map ctrl+shift+\ launch --cwd=current --location=vsplit

# Window navigation (mirrors nvim Ctrl+hjkl)
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# Remap next_layout off L (freed for navigation above)
map ctrl+shift+n next_layout

# Resize
map ctrl+shift+r start_resizing_window

# ── Theme ─────────────────────────────────────────────────
# Include the Catppuccin Mocha theme downloaded below
include mocha.conf
