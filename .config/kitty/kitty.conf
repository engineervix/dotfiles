# ── Selection ─────────────────────────────────────────────
copy_on_select yes

# ── Appearance ────────────────────────────────────────────
font_family      Maple Mono NF
geninclude font_size.py
# Lift text lightness when fg/bg contrast < WCAG AA, e.g. pre-commit's
# "Passed" (green bg, default fg) is light-on-light under Mocha
text_fg_override_threshold 4.5 ratio

# ── Background ────────────────────────────────────────────
background_opacity 0.85

# ── Cursor ────────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.1 0.4

# ── Window ────────────────────────────────────────────────
window_padding_width 10
hide_window_decorations no

# ── Keyboard ──────────────────────────────────────────────
# Option normally composes macOS special characters (Option+T -> †).
# Left Option sends Alt/Meta escape sequences instead, so Alt-key bindings work
# across CLI tools (fzf, readline, Neovim, etc.). Right Option is left alone so it
# still composes special characters (e.g. Option+3 -> #) -- with "both", zsh's vi
# mode (bindkey -v) misread the ESC from Option+3 as leaving insert mode.
macos_option_as_alt left

# ── Shell Integration ─────────────────────────────────────
# Disabled 'prompt-mark' to prevent escape sequences (133u) from leaking into the input
shell_integration enabled no-prompt-mark

# Remote control -- required for claudecode.nvim kitty vsplit integration
# listen_on creates a socket; KITTY_LISTEN_ON is inherited by child processes (including Neovim)
# so that `kitty @ launch` invoked via vim.fn.jobstart() can reach this instance
allow_remote_control yes
listen_on unix:/tmp/kitty

# ── Layouts ───────────────────────────────────────────
enabled_layouts splits, stack, tall, fat, grid

# ── Keybindings ───────────────────────────────────────
map ctrl+shift+t new_tab_with_cwd

# Splits
map ctrl+shift+' launch --cwd=current --location=hsplit
map ctrl+shift+\ launch --cwd=current --location=vsplit

# Window navigation (mirrors nvim Ctrl+hjkl)
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# Move window into neighbour's split (mirrors Hyprland SUPER+SHIFT+hjkl)
map ctrl+shift+alt+h kitten move_into.py left
map ctrl+shift+alt+j kitten move_into.py down
map ctrl+shift+alt+k kitten move_into.py up
map ctrl+shift+alt+l kitten move_into.py right

# Remap next_layout off L (freed for navigation above)
map ctrl+shift+n next_layout

# Resize
map ctrl+shift+r start_resizing_window

# Detach window (split): straight to new OS window, or ask for target (tab/os-window)
map ctrl+shift+d detach_window
map ctrl+shift+alt+d detach_window ask

# ── Theme ─────────────────────────────────────────────────
# Include the Catppuccin Mocha theme downloaded below
include mocha.conf
