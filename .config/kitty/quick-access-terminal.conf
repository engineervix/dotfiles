# Config for the quick access terminal (Super+T), see
# https://sw.kovidgoyal.net/kitty/kittens/quick-access-terminal/
# Everything not set here keeps its default, and the window still reads kitty.conf.

# No session picker here. A session opened from this process becomes part of it
# and is shown and hidden with the panel (kitty#9576). Use Super+Shift+T, which
# always opens sessions in a normal kitty. Takes effect the next time the quick
# access terminal starts (a new process), not on a running one.
kitty_override map f7>p no_op
