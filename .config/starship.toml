# Refined "True Stock" Starship Configuration
# (Matches default behavior exactly, but with Catppuccin colors and Nerd Font icons)

"$schema" = 'https://starship.rs/config-schema.json'

# Use Catppuccin Mocha colors for text/icons
palette = 'catppuccin_mocha'

# Use the official default format (includes all modules)
format = "$all"

# Stock behavior adds a newline before the prompt for readability
add_newline = true

[directory]
style = "bold blue"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold red"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = 'via [$symbol($version )(\($virtualenv\) )]($style)'

[golang]
symbol = " "
style = "bold sky"
format = "via [$symbol($version )]($style)"

[php]
symbol = " "
style = "bold blue"
format = "via [$symbol($version )]($style)"

[java]
symbol = " "
style = "bold red"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold blue"
format = "via [$symbol$context]($style) "

[cmd_duration]
min_time = 500
show_milliseconds = false
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[✖](bold red)"
vimcmd_symbol = "[❮](bold green)"

[time]
disabled = true # Stock default is disabled
time_format = "%R"
style = "bold subtext0"
format = "at [$time]($style) "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
