services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    security_opt:
      - label:disable
    environment:
      CONTAINERS: 1
      NETWORKS: 1
    volumes:
      - ${XDG_RUNTIME_DIR}/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik

  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik
      - --entryPoints.web.address=:80
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.file.directory=/dynamic # routes to dev servers running on the host
      - --providers.file.watch=true
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080" # dashboard: http://localhost:8080/dashboard/ (loopback only)
    extra_hosts:
      # rootless Docker blocks host loopback, so point at a host-local address
      - "host.docker.internal:10.254.254.254"
    volumes:
      - ./dynamic:/dynamic:ro
    networks:
      - traefik

networks:
  traefik:
    external: true
